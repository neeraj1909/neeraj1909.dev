<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Neeraj Singh — Applied AI / LLM Engineer</title>
  <desc id="description">A dark, olive and lime portfolio preview with an abstract trace from input through reasoning to evidence.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10120f"/><stop offset="1" stop-color="#1b2018"/></linearGradient>
    <linearGradient id="orb" x2="1" y2="1"><stop stop-color="#b6d878" stop-opacity=".17"/><stop offset="1" stop-color="#b6d878" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#a3ad91" stroke-opacity=".07"/></pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <path d="M48 55H1152M48 575H1152" stroke="#a3ad91" stroke-opacity=".22"/>
  <text x="68" y="98" fill="#e5e8df" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3">N<tspan fill="#b6d878">.</tspan><tspan dx="13" fill="#c5c9bd" font-size="13" letter-spacing="2.5">NEERAJ SINGH</tspan></text>
  <text x="1132" y="96" text-anchor="end" fill="#92998b" font-family="monospace" font-size="12" letter-spacing="2">APPLIED AI · RESEARCH TO SYSTEMS</text>
  <text x="68" y="255" fill="#f0f1e9" font-family="Inter, Arial, sans-serif" font-size="66" font-weight="600" letter-spacing="-3">Trace the answer.</text>
  <text x="68" y="334" fill="#b6d878" font-family="Inter, Arial, sans-serif" font-size="66" font-weight="600" font-style="italic" letter-spacing="-3">Show the work.</text>
  <text x="72" y="391" fill="#b5baad" font-family="Inter, Arial, sans-serif" font-size="19">Applied AI engineering across explainability, research search,</text>
  <text x="72" y="420" fill="#b5baad" font-family="Inter, Arial, sans-serif" font-size="19">and evidence-grounded retrieval workflows.</text>
  <g transform="translate(780 165)">
    <circle cx="178" cy="170" r="156" fill="url(#orb)"/>
    <circle cx="178" cy="170" r="132" fill="none" stroke="#73815f" stroke-opacity=".55"/>
    <circle cx="178" cy="170" r="99" fill="none" stroke="#73815f" stroke-opacity=".45" stroke-dasharray="3 8"/>
    <path d="M48 170h70l40-59 51 111 42-52h58" fill="none" stroke="#b6d878" stroke-width="2"/>
    <circle cx="48" cy="170" r="7" fill="#b6d878"/><circle cx="158" cy="111" r="6" fill="#cfc1a2"/><circle cx="209" cy="222" r="6" fill="#b6d878"/><circle cx="309" cy="170" r="7" fill="#cfc1a2"/>
    <circle cx="178" cy="170" r="49" fill="#171c14" stroke="#596649"/>
    <text x="178" y="165" text-anchor="middle" fill="#aab19f" font-family="monospace" font-size="9" letter-spacing="1.5">INPUT → OUTPUT</text>
    <text x="178" y="188" text-anchor="middle" fill="#e4e9da" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600">make sense</text>
    <text x="22" y="33" fill="#a5aa9d" font-family="monospace" font-size="10" letter-spacing="1.3">01 / INPUT</text>
    <text x="264" y="33" fill="#a5aa9d" font-family="monospace" font-size="10" letter-spacing="1.3">02 / REASON</text>
    <text x="22" y="326" fill="#a5aa9d" font-family="monospace" font-size="10" letter-spacing="1.3">03 / EVIDENCE</text>
  </g>
  <text x="68" y="550" fill="#a6aa9e" font-family="monospace" font-size="11" letter-spacing="2">MODEL EXPLAINABILITY  ·  RESEARCH TOOLING  ·  RETRIEVAL SYSTEMS</text>
  <text x="1132" y="550" text-anchor="end" fill="#b6d878" font-family="monospace" font-size="12" letter-spacing="1">NEERAJ1909.DEV</text>
